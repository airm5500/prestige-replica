# Prestige Replica Manager — Control Plane
# Aucun secret ne doit figurer dans ce fichier : utiliser des variables
# d'environnement (PRM_*, QUARKUS_*) ou un fichier .env protégé.

quarkus.application.name=prestige-replica-manager

# ---- Réseau ---------------------------------------------------------------
# Par défaut, écoute locale uniquement (§11 : ne pas exposer la console par accident).
quarkus.http.host=${PRM_HTTP_HOST:127.0.0.1}
quarkus.http.port=${PRM_HTTP_PORT:8080}
quarkus.http.ssl-port=${PRM_HTTPS_PORT:8443}
quarkus.http.insecure-requests=${PRM_INSECURE_REQUESTS:enabled}
quarkus.http.ssl.certificate.files=${PRM_TLS_CERT:}
quarkus.http.ssl.certificate.key-files=${PRM_TLS_KEY:}
# mTLS agents : REQUEST = certificat demandé ; activer prm.agent.require-client-certificate pour l'exiger.
quarkus.http.ssl.client-auth=${PRM_TLS_CLIENT_AUTH:NONE}
quarkus.http.ssl.certificate.trust-store-file=${PRM_TLS_CLIENT_CA:}
prm.agent.require-client-certificate=${PRM_AGENT_REQUIRE_CLIENT_CERT:false}
quarkus.http.limits.max-body-size=20M

# ---- Base de métadonnées PostgreSQL ---------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PRM_DB_URL:jdbc:postgresql://127.0.0.1:5432/prm}
quarkus.datasource.username=${PRM_DB_USER:prm}
quarkus.datasource.password=${PRM_DB_PASSWORD:}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true

# ---- Authentification de la console ---------------------------------------
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.new-cookie-interval=PT1M
quarkus.http.auth.session.encryption-key=${PRM_SESSION_KEY:}
quarkus.http.auth.basic=true
prm.bootstrap.admin-username=${PRM_BOOTSTRAP_ADMIN_USERNAME:admin}
prm.bootstrap.admin-password=${PRM_BOOTSTRAP_ADMIN_PASSWORD:}

# ---- Santé, métriques, API -------------------------------------------------
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=live
quarkus.smallrye-health.readiness-path=ready
quarkus.smallrye-health.startup-path=startup
quarkus.smallrye-openapi.info-title=Prestige Replica Manager API
quarkus.smallrye-openapi.info-version=1.0
quarkus.swagger-ui.always-include=false

# ---- Supervision ----------------------------------------------------------
prm.health.evaluation-interval=30s
prm.metrics.retention-days=30

# ---- Notifications --------------------------------------------------------
quarkus.mailer.from=${PRM_MAIL_FROM:prm@localhost}
quarkus.mailer.host=${PRM_SMTP_HOST:127.0.0.1}
quarkus.mailer.port=${PRM_SMTP_PORT:25}
quarkus.mailer.username=${PRM_SMTP_USER:}
quarkus.mailer.password=${PRM_SMTP_PASSWORD:}
quarkus.mailer.start-tls=${PRM_SMTP_STARTTLS:OPTIONAL}
quarkus.mailer.mock=${PRM_MAIL_MOCK:false}

# ---- Journaux -------------------------------------------------------------
quarkus.log.console.json=${PRM_LOG_JSON:false}
quarkus.log.category."com.prestige".level=INFO

# ---- Profils --------------------------------------------------------------
%dev.quarkus.mailer.mock=true
%dev.prm.bootstrap.admin-password=${PRM_BOOTSTRAP_ADMIN_PASSWORD:admin-dev-password}
%test.quarkus.datasource.jdbc.url=${PRM_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/prm_test}
%test.quarkus.datasource.username=${PRM_TEST_DB_USER:prm}
%test.quarkus.datasource.password=${PRM_TEST_DB_PASSWORD:prm}
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.mailer.mock=true
%test.prm.bootstrap.admin-password=test-admin-password
%test.prm.health.evaluation-interval=off
%test.prm.drill.interval=off
%test.quarkus.http.auth.session.encryption-key=test-session-key-0123456789abcdef
