name: CI
on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod }
      - run: cd agent && go vet ./... && go test ./...
      - run: cd agent && GOOS=windows go vet ./... && GOOS=windows go build ./cmd/prm-agent

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: prm_test, POSTGRES_USER: prm, POSTGRES_PASSWORD: prm }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U prm" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: cd control-plane && mvn -B test
